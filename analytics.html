<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spending Analytics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Budget Tracker</h1>
        <p>View your spending and income information.</p>
    </header>

    <main>

        <!-- Analytics Section -->
        <section>
            <h2>Spending Analytics</h2>

            <!-- Sample data for the basic prototype -->
            <div>
                <h3>Total Income</h3>
                <p>$1200.00</p>
            </div>

            <div>
                <h3>Total Expenses</h3>
                <p>$650.00</p>
            </div>

            <div>
                <h3>Balance</h3>
                <p>$550.00</p>
            </div>
        </section>


        <!-- Simple category breakdown -->
        <section>
            <h2>Expenses by Category</h2>

            <p>Food: $200.00</p>
            <p>Transportation: $100.00</p>
            <p>School: $350.00</p>
        </section>


        <!-- Return to main dashboard -->
        <p>
            <a href="index.html">Back to Dashboard</a>
        </p>

    </main>

</body>

</html>
