<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Budget Tracker</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top section of the page -->
    <header>
        <h1>Student Budget Tracker</h1>
        <p>Track your income, expenses, and monthly budget.</p>
    </header>


    <main>

        <!-- Summary:
            Shows income, expenses,
            and remaining balance. -->
        <section class="summary">

            <div class="card">
                <h2>Income</h2>
                <p id="income">$0.00</p>
            </div>

            <div class="card">
                <h2>Expenses</h2>
                <p id="expenses">$0.00</p>
            </div>

            <div class="card">
                <h2>Balance</h2>
                <p id="balance">$0.00</p>
            </div>

        </section>


        <!-- ADD TRANSACTION FORM
             User enters income or
             expense information here. -->
        <section class="card">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <!-- Choose income or expense -->
                <label for="type">Type</label>

                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>


                <!-- Short name for transaction -->
                <label for="description">Description</label>

                <input
                    type="text"
                    id="description"
                    placeholder="Example: Groceries"
                    required
                >


                <!-- Spending category -->
                <label for="category">Category</label>

                <select id="category">
                    <option>Food</option>
                    <option>Housing</option>
                    <option>Transportation</option>
                    <option>School</option>
                    <option>Entertainment</option>
                    <option>Income</option>
                    <option>Other</option>
                </select>


                <!-- Dollar amount -->
                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    step="0.01"
                    required
                >


                <!-- Adds transaction to the list -->
                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- HISTORY
             Displays all transactions
             entered by the user. -->
        <section class="card">

            <div class="transaction-header">

                <h2>Recent Transactions</h2>

                <!-- Removes all transactions -->
                <button
                    id="clearHistory"
                    class="delete-button"
                    type="button"
                >
                    Clear History
                </button>

            </div>


            <table>

                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <!-- JavaScript adds rows -->
                <tbody id="transactionList">
                </tbody>

            </table>

        </section>

    </main>


    <!-- Connect JavaScript file -->
    <script src="app.js"></script>

</body>
</html>
